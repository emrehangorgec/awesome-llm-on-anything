name: Lint

on:
  pull_request:
    paths: ["README.md"]
  push:
    branches: [main]
    paths: ["README.md"]

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes awesome-lint@2.3.0 README.md
